<title>Excuse Button — Nafs Warrior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2efe6;--surf:#faf8f2;--ink:#2a2d1a;--mut:#677055;--acc:#857040;--line:rgba(64,68,44,.13);--btn:#7a9972;--btnt:#f2efe6;padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{color-scheme:dark;--bg:#181a1b;--surf:#202325;--ink:#f2efe6;--mut:#9cb194;--acc:#c9a862;--line:rgba(156,177,148,.15);--btn:#9cb194;--btnt:#181a1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:28px 20px 60px}
h1{font:700 44px/1.1 Amiri,Georgia,serif;margin:8px 0 6px}
h2{font:700 28px/1.25 Amiri,Georgia,serif;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 26px}
.menu{display:grid;gap:10px}
.menu button{text-align:left;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.menu button:hover{transform:translateX(4px);border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:12px 26px;font:600 16px Figtree,sans-serif;cursor:pointer;margin:6px 8px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:var(--mut);font-size:14px}
.top button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:4px 0}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.card{animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
p.body{margin:0 0 16px;white-space:pre-line}
textarea,input[type=text]{width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;margin:6px 0 14px;resize:vertical}
.note{color:var(--mut);font-size:14px;margin:-8px 0 14px}
.ayah{background:var(--surf);border-radius:16px;padding:22px;margin:0 0 18px;border-inline-start:4px solid var(--acc)}
.ar{font:400 30px/2 Amiri,serif;direction:rtl;text-align:right;margin:0 0 10px}
.tr{margin:0 0 6px}.ref{color:var(--acc);font-weight:600;font-size:15px;margin:0}
.reply{background:var(--surf);border-radius:12px;padding:14px 16px;margin:6px 0 14px;animation:in .4s}
.heart{width:90px;height:90px;display:block;margin:6px auto 20px;animation:beat .9s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.timer{font:700 64px/1 Amiri,serif;text-align:center;margin:10px 0 18px;color:var(--acc);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border-radius:12px;padding:12px 14px;margin:0 0 8px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:560px){.boxes{grid-template-columns:1fr}}
.gift{perspective:800px}
.gift button{width:100%;min-height:130px;background:var(--surf);color:var(--ink);border:1px dashed var(--acc);border-radius:16px;font:inherit;cursor:pointer;transition:transform .6s}
.gift .in{display:none;padding:16px;background:var(--surf);border-radius:16px;border:1px solid var(--acc)}
.gift.open button{display:none}
.gift.open .in{display:block;animation:flip .7s}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.scene{position:relative;height:230px;background:var(--surf);border-radius:16px;overflow:hidden;margin-bottom:16px}
.water{position:absolute;left:0;right:0;bottom:0;height:120px;background:#3C9DB555}
.potato{position:absolute;left:50%;bottom:30px;width:110px;height:78px;margin-left:-55px;background:#B98A4E;border-radius:55% 45% 50% 50%;transition:transform 1.4s}
.spoon{position:absolute;left:12%;top:20px;font-size:40px;transform-origin:top left}
.scene.try .spoon{animation:scoop 2.4s ease-in-out}
.scene.try .potato{animation:slip 2.4s ease-in-out}
@keyframes scoop{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(70px,70px) rotate(20deg)}60%{transform:translate(70px,40px) rotate(20deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes slip{30%{transform:translateY(0)}55%{transform:translateY(-22px)}80%{transform:translateY(4px)}}
.hands{position:absolute;left:50%;margin-left:-30px;bottom:-60px;font-size:56px;transition:bottom 1.4s}
.scene.lift .potato{transform:translateY(-110px)}
.scene.lift .hands{bottom:60px}
.final{text-align:center;padding-top:30px}
.brand{font:600 15px Figtree,sans-serif;letter-spacing:.08em;color:var(--acc);margin:0}
.q{display:block;font-weight:600;margin-top:10px}
.menu button{border-radius:18px}
.btn{box-shadow:0 0 0 0 var(--acc);transition:box-shadow .2s}.btn:hover:not(:disabled){box-shadow:0 0 18px -4px var(--acc)}
.final .ar{text-align:center;font-size:40px}
.bg-x{}
body{font-family:Manrope,system-ui,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
h1,h2,.timer,.brand{font-family:'Cormorant Garamond',Georgia,serif}
.btn,.menu button,textarea,input[type=text]{font-family:Manrope,sans-serif}
.btn{border-radius:12px;box-shadow:none}.btn:hover:not(:disabled){box-shadow:none;opacity:.88}
.heart path{fill:var(--btn)}
header{position:sticky;top:0;z-index:20;background:var(--surf);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:700 1.5rem 'Cormorant Garamond',Georgia,serif;color:var(--ink);text-decoration:none;margin-right:auto}
.hh{color:var(--btn);display:inline-block;animation:beat 1.5s ease-in-out infinite}
nav{display:flex;gap:6px}
nav button,#th{background:none;border:0;color:var(--mut);font:600 .88rem Manrope,sans-serif;padding:8px 12px;border-radius:10px;cursor:pointer}
nav button.on,nav button:hover,#th:hover{background:rgba(156,177,148,.15);color:var(--ink)}
.entry{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.eh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:10px}.eh small{color:var(--mut);font-weight:500}
.eq{color:var(--mut);font-size:.88rem;margin:8px 0 2px}.ea{margin:0;white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var app=document.getElementById("app"),flow=null,i=0,tick=null,log=[],K="nafs_diary_v1";
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

 var f=c.querySelectorAll("textarea,input[type=text]"),l=c.querySelectorAll("label.q");
 f.forEach(function(e,k){var v=e.value.trim();if(v)log.push({q:l[k]?l[k].textContent:(s.q||""),a:v})})}

 clearInterval(tick);flow=null;var d=load();
 app.innerHTML='<div class="card"><p class="brand">Nafs Warrior</p><h1>My Diary</h1><div class="reply"><strong>We save nothing about you.</strong> No account, no server, no cloud. Everything here lives only in this browser, on this device. It’s all with you, and it ends the moment you switch to another phone or clear your browser data.</div>'+
 (d.length?d.map(function(e){return'<div class="entry"><div class="eh"><span>'+esc(e.excuse)+'</span><small>'+esc(e.date)+'</small></div>'+e.items.map(function(x){return'<p class="eq">'+esc(x.q)+'</p><p class="ea">'+esc(x.a)+'</p>'}).join('')+'<button class="btn alt del" data-id="'+e.id+'">Delete</button></div>'}).join('')+'<button class="btn alt" id="clr">Clear whole diary</button>':'<p class="note">Nothing here yet. Finish an excuse in the Excuse Button and your reflections will show up here. The sin you name is never saved.</p>')+'</div>';
 app.querySelectorAll(".del").forEach(function(b){b.onclick=function(){save(load().filter(function(e){return String(e.id)!=b.dataset.id}));diary()}});
 var c=document.getElementById("clr");if(c)c.onclick=function(){if(confirm("Delete everything in your diary?")){save([]);diary()}}
}
function hl(){var dd=location.hash=="#diary";document.getElementById("tabD").classList.toggle("on",dd);document.getElementById("tabE").classList.toggle("on",!dd)}
function route(){if(location.hash=="#diary")diary();else menu();hl()}
function $(s,e){return(e||document).querySelector(s)}
function menu(){
 clearInterval(tick);flow=null;i=0;
 app.innerHTML='<div class="card"><p class="brand">Nafs Warrior</p><h1>Excuse Tool</h1><p class="sub">Pick the excuse you’re telling yourself right now. Your reflections are kept only on this device, in My Diary. Nothing is sent to us.</p><div class="menu">'+
 FLOWS.map(function(f,k){return'<button data-k="'+k+'">'+(k+1)+'. '+f.name+'</button>'}).join('')+'</div><p class="note" style="text-align:center;margin-top:24px">We made a video on this. <a href="https://youtu.be/arxjUH45-Rs?si=0ZFMS3v90gejERDm" target="_blank" rel="noopener" style="color:var(--acc);font-weight:600">Watch it here</a></p><p class="ar" style="text-align:center;margin-top:36px">إِنَّ مَعَ الْعُسْرِ يُسْرًا</p><p class="note" style="text-align:center">“Indeed, with hardship comes ease.” Surah Ash-Sharh, 94:6</p><p class="note" style="text-align:center">Excuse Tool is a companion, not a replacement for professional mental health care.</p></div>';
 app.querySelectorAll(".menu button").forEach(function(b){b.onclick=function(){var f=FLOWS[+b.dataset.k],ss=[ROOT,PATTERN];f.steps.forEach(function(s){ss.push(s);if(s===TIMER)ss.push(REPL)});flow={name:f.name,steps:ss};i=0;log=[];show()}});
}
function ayahHTML(a){var x=AY[a];return'<div class="ayah"><p class="ar">'+x.ar+'</p>'+(x.tl?'<p class="tr"><em>'+x.tl+'</em></p>':'')+'<p class="tr">'+x.tr+'</p><p class="ref">'+x.ref+'</p></div>'}
function nxt(on){var last=i==flow.steps.length-1;return'<button class="btn" id="nx"'+(on?'':' disabled')+'>'+(last?'Finish':'Continue')+'</button>'}
function go(){grab();i++;if(i>=flow.steps.length)finish();else show()}
function finish(){if(log.length){var d=load();d.unshift({id:Date.now(),excuse:flow.name,date:new Date().toLocaleString(),items:log});save(d)}log=[];
 app.innerHTML='<div class="card final"><p class="ar">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ</p><h2>You’ll be alright</h2><p class="body">Ask Allah SWT for strength. Read <em>lā ḥawla wa lā quwwata illā billāh</em>.\n\nIf there is something deeper beneath this excuse, please seek help.\n\nYou’ll be alright, my dear Nafs Warrior. May Allah SWT help you. Ameen.</p><div class="reply"><strong>Having an urge to sin?</strong> Ask Allah to help you, and have yaqeen that He will. We built a button for you. Use it.</div><button class="btn" id="urge">Go to the urge button</button><button class="btn alt" id="dy">Open my diary</button><button class="btn alt" id="home">Back to the list</button></div>';
 $("#home").onclick=menu;$("#dy").onclick=function(){location.hash="diary"};$("#urge").onclick=function(){location.href="urge.html"};
}
function show(){
 clearInterval(tick);
 var s=flow.steps[i],h='';
 h+='<div class="top"><button id="bk">← All excuses</button><span>'+flow.name+'</span></div><div class="bar"><i style="width:'+(i/flow.steps.length*100)+'%"></i></div><div class="card" id="c">';
 if(s.t=="text")h+='<h2>'+s.h+'</h2><p class="body">'+s.b+'</p>'+nxt(1);
 else if(s.t=="ayah")h+=ayahHTML(s.a)+nxt(1);
 else if(s.t=="yn")h+=(s.heart?'<svg class="heart" viewBox="0 0 24 24"><path fill="#C8453B" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>':'')+'<h2>'+s.q+'</h2><div id="ans"><button class="btn" data-a="y">Yes</button><button class="btn alt" data-a="n">No</button></div><div id="rp"></div>';
 else if(s.t=="input")h+='<h2>'+s.q+'</h2>'+(s.rows==1?'<input type="text" placeholder="'+s.ph+'">':'<textarea rows="'+s.rows+'" placeholder="'+s.ph+'"></textarea>')+nxt(1);
 else if(s.t=="root")h+='<h2>Before the excuse, look underneath it</h2>'+['What triggered the urge?','What were you feeling right then?','What were you trying to escape, or to get?'].map(function(q){return'<label class="q">'+q+'</label><textarea rows="2"></textarea>'}).join('')+'<p class="note">Saved only on this device, in My Diary.</p>'+nxt(1);
 else if(s.t=="private")h+='<h2>Name the sin you’re about to do</h2><textarea rows="3" placeholder="Only you can see this…"></textarea><p class="note">Private. This never leaves your device and isn’t stored.</p>'+nxt(1);
 else if(s.t=="timer")h+='<h2>Research the harms of this action</h2><p class="body">Optional: use the 5-minute timer if it helps. Pause it any time, or continue whenever you’re ready.</p><div class="timer" id="tm">5:00</div><button class="btn" id="st">Start timer</button>'+['Spiritual consequences','Psychological effects','Impact on your relationships','Long-term consequences'].map(function(q){return'<label class="q">'+q+'</label><textarea rows="2" placeholder="What did you find?"></textarea>'}).join('')+nxt(1);
 else if(s.t=="choice")h+='<h2>'+s.q+'</h2><div id="ans">'+s.o.map(function(o,k){return'<button class="btn alt" data-a="'+k+'">'+o+'</button>'}).join('')+'</div><div id="rp"></div>';
 else if(s.t=="check")h+='<h2>'+s.h+'</h2><p class="note">Tick each one to continue.</p>'+s.items.map(function(x){return'<label class="chk"><input type="checkbox"><span>'+x+'</span></label>'}).join('')+nxt(0);
 else if(s.t=="reveal")h+='<h2>Open both</h2><div class="boxes">'+s.a.map(function(a){return'<div class="gift"><button>Tap to open</button><div class="in">'+ayahHTML(a)+'</div></div>'}).join('')+'</div>'+nxt(0);
 else if(s.t=="potato")h+='<h2>A big potato is sunk in water</h2><p class="body">You try to get it out with a small spoon. It keeps slipping away. What do you do?</p><div class="scene" id="sc"><div class="water"></div><div class="potato"></div><div class="spoon">🥄</div><div class="hands">🤲</div></div><div id="ans"><button class="btn alt" data-a="0">“It’s not in my control”</button><button class="btn" data-a="1">Use my hands</button></div><div id="rp"></div>';
 h+='</div>';
 app.innerHTML=h;
 $("#bk").onclick=menu;
 var nb=$("#nx");if(nb)nb.onclick=go;
 var rp=$("#rp");
 function say(m){rp.innerHTML='<div class="reply">'+m+'</div>'+nxt(1);$("#nx").onclick=go;}
 if(s.t=="yn")app.querySelectorAll("#ans button").forEach(function(b){b.onclick=function(){var a=b.dataset.a;log.push({q:s.q,a:b.textContent});var m=typeof s.r=="string"?s.r:s.r[a];say(m);$("#ans").style.display="none"}});
 if(s.t=="choice")app.querySelectorAll("#ans button").forEach(function(b){b.onclick=function(){var a=b.dataset.a;log.push({q:s.q,a:b.textContent});var m=typeof s.r=="string"?s.r:s.r[a];say(m);$("#ans").style.display="none"}});
 if(s.t=="check"){var cs=app.querySelectorAll("input");cs.forEach(function(c){c.onchange=function(){var ok=[].every.call(cs,function(x){return x.checked});nb.disabled=!ok}})}
 if(s.t=="reveal"){var n=0;app.querySelectorAll(".gift button").forEach(function(b){b.onclick=function(){b.parentNode.classList.add("open");if(++n==2)nb.disabled=false}})}
 if(s.t=="potato"){var sc=$("#sc");app.querySelectorAll("#ans button").forEach(function(b){b.onclick=function(){
  sc.classList.remove("try");void sc.offsetWidth;
  if(b.dataset.a=="0"){sc.classList.add("try");rp.innerHTML='<div class="reply">The spoon was never going to be enough. But you’re not limited to the spoon. Try again.</div>'}
  else{sc.classList.add("lift");$("#ans").style.display="none";say("Taking action is what changes things. Allah said whoever fears Him, He makes a way out. Use your hands.")}}})}
 if(s.t=="timer"){var left=300,tm=$("#tm"),st=$("#st"),run=0;st.onclick=function(){if(run){run=0;clearInterval(tick);st.textContent="Resume"}else{run=1;st.textContent="Pause";tick=setInterval(function(){left--;tm.textContent=Math.floor(left/60)+":"+("0"+left%60).slice(-2);if(left<=0){clearInterval(tick);tm.textContent="Done";st.style.display="none"}},1000)}}}
}
document.getElementById("tabE").onclick=function(){if(location.hash=="#diary")location.hash="excuse";else{menu();hl()}};
document.getElementById("tabD").onclick=function(){location.hash="diary"};
addEventListener("hashchange",route);
try{var th0=localStorage.getItem("theme");if(th0)document.documentElement.dataset.theme=th0}catch(e){}
document.getElementById("th").onclick=function(){var r=document.documentElement,t=r.dataset.theme=="dark"?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}};
route();
</script>
</body>
